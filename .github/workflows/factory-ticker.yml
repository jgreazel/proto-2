# Heartbeat: GitHub cron proved unreliable here, so this run loops and
# dispatches Factory every 3 min, then re-dispatches itself before the 6h job cap.
name: Factory ticker

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # revive if the chain ever breaks

concurrency:
  group: factory-ticker
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch Factory every 3 min
        run: |
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            gh workflow run factory.yml --ref main || echo "dispatch failed, retrying next tick"
            sleep 180
          done
      - name: Hand off to the next ticker
        if: always()
        run: gh workflow run factory-ticker.yml --ref main
