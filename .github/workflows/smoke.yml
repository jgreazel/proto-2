name: Smoke

# Vercel posts a GitHub deployment per build; test the live URL.
on: deployment_status

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.deployment.sha }}-${{ github.event.deployment.environment }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # signed-in test only runs on preview (dev Clerk + dev DB)
      E2E_USERNAME: ${{ github.event.deployment.environment == 'Preview' && secrets.E2E_USERNAME || '' }}
      E2E_PASSWORD: ${{ github.event.deployment.environment == 'Preview' && secrets.E2E_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ github.event.deployment.environment }}
          path: test-results/
          retention-days: 7
